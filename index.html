  <style>
    :root {
      --bg: #f6f4ef;
      --paper: #fdfbf7;
      --card: #ffffff;
      --ink: #2a2622;
      --muted: #6e675f;
      --line: #e4ddd1;
      --accent: #b4332b;      /* 朱紅 */
      --accent-soft: #f9ebe9;
      --accent2: #1f5f8b;     /* 靛藍 */
      --accent2-soft: #e9f2f8;
      --gold: #a67c2e;
      --gold-soft: #f7f1e3;
      --shadow: 0 4px 16px -4px rgba(42, 38, 34, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }

    /* 隱形橫向捲動列 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 日系和紙微紋理背景 */
    .washi-bg {
      background-color: var(--bg);
      background-image: radial-gradient(rgba(180, 51, 43, 0.04) 1px, transparent 0),
                        radial-gradient(rgba(31, 95, 139, 0.03) 1px, transparent 0);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    /* 地圖標記高亮脈衝動畫 */
    @keyframes markerPulse {
      0% {
        transform: scale(1);
        opacity: 0.85;
      }
      70% {
        transform: scale(2.4);
        opacity: 0;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .pulse-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: markerPulse 1.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    @keyframes subtleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .marker-active {
      animation: subtleBob 1.2s ease-in-out infinite;
    }

    /* 卡片與互動回饋 */
    .journal-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .timeline-row {
      transition: background-color 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    }

    .timeline-row.is-clickable:hover {
      background-color: #faf7f2;
    }

    .timeline-row.is-selected {
      background-color: var(--accent-soft);
      border-color: rgba(180, 51, 43, 0.45);
    }

    /* 安全區域支援 */
    .safe-top {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }

    /* 自訂核取方塊 */
    .custom-check {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #c8bfb0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .custom-check:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .custom-check:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1.5px;
      width: 6px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2.2px 2.2px 0;
      transform: rotate(45deg);
    }

    /* 列印樣式優化 */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .journal-card { box-shadow: none !important; border: 1px solid #ccc !important; }
    }
  </style>
</head>

    /**

     * 0. 通行密碼設定（可隨時在此修改密碼）
     * ============================================================================
     */
    const TRIP_PASSCODE = "04140705"; 
    const AUTH_STORAGE_KEY = "kyoto_nagoya_trip_unlocked_v1";

    function initPasscodeGate() {
      const gate = document.getElementById("passcodeGate");
      const form = document.getElementById("passcodeForm");
      const input = document.getElementById("passcodeInput");
      const err = document.getElementById("passcodeError");

      // 若本機已解鎖過，直接隱藏鎖定畫面
      try {
        if (localStorage.getItem(AUTH_STORAGE_KEY) === TRIP_PASSCODE) {
          gate.classList.add("hidden");
          return;
        }
      } catch (e) {}

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const val = (input.value || "").trim();
        if (val === TRIP_PASSCODE) {
          try {
            localStorage.setItem(AUTH_STORAGE_KEY, TRIP_PASSCODE);
          } catch (e) {}
          gate.classList.add("hidden");
          err.classList.add("hidden");
          showToast("歡迎！已解鎖行程表");
        } else {
          err.classList.remove("hidden");
          input.value = "";
          input.focus();
        }
      });
    }

    /**
     * ============================================================================
     * 2. 狀態管理與 localStorage（行前清單勾選狀態、目前分頁、高亮地點）
     * ============================================================================
     */
    const STORAGE_KEY = "kyoto_nagoya_trip_todos_v2";
    let todoState = {};
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) todoState = JSON.parse(saved);
    } catch (e) {
      todoState = {};
    }

    function saveTodoState() {
      try {

      } catch (e) {
        // 忽略無痕模式限制
      }

    let currentTab = "overview"; // "overview" | "day1" .. "day6"

    // 支援 URL Hash 定位分頁（例如 #day2）
    function initTabFromHash() {
      const hash = (window.location.hash || "").replace("#", "").trim();
      if (hash === "overview" || DAYS.some(d => d.id === hash)) {
        currentTab = hash;
      }

    /**
     * ============================================================================
     * 3. 向量互動路線圖渲染器（完全自給自足，含地理網格、水體/海岸輪廓、主路線與局部放大圖）
     * ============================================================================
     */
    function buildVectorMapSVG(config, stopOrderList, selectedKey, mapIdPrefix) {
      const { keys, centerLat, centerLng, spanLat, spanLng } = config;
      const width = 640;
      const height = 340;
      const padX = 56;
      const padY = 42;

      function project(lat, lng) {
        const nx = (lng - (centerLng - spanLng / 2)) / spanLng;
        const ny = 1 - (lat - (centerLat - spanLat / 2)) / spanLat;
        return {
          x: padX + nx * (width - padX * 2),
          y: padY + ny * (height - padY * 2)
        };
      }

      // 地理參考輪廓（簡易水體、海岸與河川示意，增添日系地圖質感）
      let geoFeatures = "";

      if (centerLng < 135.6 && spanLng > 0.3) {
        const seaP1 = project(34.50, 135.05);
        const seaP2 = project(34.68, 135.38);
        geoFeatures += `
          <path d="M 0 ${height} L 0 ${seaP1.y} Q ${seaP2.x * 0.6} ${seaP2.y}, ${seaP2.x} ${height} Z"
                fill="#dceaf2" opacity="0.7" />
          <text x="36" y="${height - 18}" font-size="11" fill="#5e87a1" font-weight="600">大阪灣</text>
        `;
      }

      if (centerLng > 136.7 && centerLat < 35.14) {
        const bayTop = project(35.055, 136.75);
        const bayRight = project(34.82, 136.86);
        geoFeatures += `
          <path d="M 0 ${bayTop.y + 18} Q ${width * 0.45} ${bayTop.y + 8}, ${bayRight.x} ${height} L 0 ${height} Z"
                fill="#dceaf2" opacity="0.75" />
          <text x="34" y="${height - 18}" font-size="11" fill="#5e87a1" font-weight="600">伊勢灣・名古屋港</text>
        `;
      }

      if (centerLng > 135.65 && centerLng < 135.82 && spanLng < 0.15) {
        const kamoTop = project(35.045, 135.770);
        const kamoBot = project(34.975, 135.768);
        const katsuraTop = project(35.016, 135.675);
        const katsuraBot = project(34.995, 135.695);
        geoFeatures += `
          <path d="M ${kamoTop.x} ${kamoTop.y} Q ${(kamoTop.x + kamoBot.x) / 2 + 4} ${(kamoTop.y + kamoBot.y) / 2}, ${kamoBot.x} ${kamoBot.y}"
                stroke="#bdd8e8" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.75" />
          <path d="M ${katsuraTop.x} ${katsuraTop.y} Q ${(katsuraTop.x + katsuraBot.x) / 2 - 6} ${(katsuraTop.y + katsuraBot.y) / 2}, ${katsuraBot.x} ${katsuraBot.y}"
                stroke="#bdd8e8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.75" />
        `;
      }

      const points = keys
        .filter(k => S[k])
        .map((k, idx) => {
          const item = S[k];
          const pt = project(item.lat, item.lng);
          const stopIndex = stopOrderList.indexOf(k);
          return {
            key: k,
            item,
            x: Math.max(32, Math.min(width - 32, pt.x)),
            y: Math.max(30, Math.min(height - 30, pt.y)),
            num: stopIndex >= 0 ? stopIndex + 1 : idx + 1
          };
        });

      let routePathD = "";
      points.forEach((p, idx) => {
        routePathD += (idx === 0 ? `M ${p.x.toFixed(1)} ${p.y.toFixed(1)}` : ` L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
      });

      const labelPositions = points.map((p, idx) => {
        let dx = 0;
        let dy = -16;
        let anchor = "middle";

        if (idx > 0) {
          const prev = points[idx - 1];
          if (Math.abs(p.y - prev.y) < 26 && Math.abs(p.x - prev.x) < 95) {
            dy = idx % 2 === 0 ? -17 : 24;
          }
        }
        if (p.x < 95) {
          anchor = "start";
          dx = 14;
          dy = 4;
        } else if (p.x > width - 95) {
          anchor = "end";
          dx = -14;
          dy = 4;
        }
        return { dx, dy, anchor };
      });

      let gridLines = "";
      for (let gx = 80; gx < width; gx += 80) {
        gridLines += `<line x1="${gx}" y1="0" x2="${gx}" y2="${height}" stroke="#e7e0d4" stroke-width="1" />`;
      }
      for (let gy = 68; gy < height; gy += 68) {
        gridLines += `<line x1="0" y1="${gy}" x2="${width}" y2="${gy}" stroke="#e7e0d4" stroke-width="1" />`;
      }

      const markersSvg = points.map((p, idx) => {
        const isSelected = selectedKey === p.key;
        const isHotel = Boolean(p.item.isHotel);
        const fill = isHotel ? "#1f5f8b" : "#b4332b";
        const lp = labelPositions[idx];
        const shortName = p.item.name.split("（")[0].split("・")[0];

        return `
          <g class="map-node cursor-pointer ${isSelected ? "marker-active" : ""}"
             data-point="${p.key}"
             role="button"
             tabindex="0"
             aria-label="定位 ${p.item.name}">
            ${isSelected ? `
              <circle cx="${p.x}" cy="${p.y}" r="15" fill="${fill}" class="pulse-ring" />
              <circle cx="${p.x}" cy="${p.y}" r="18" fill="none" stroke="${fill}" stroke-width="2" opacity="0.65" />
            ` : ""}
            <circle cx="${p.x}" cy="${p.y}" r="${isSelected ? 13 : 11}"
                    fill="${fill}" stroke="#ffffff" stroke-width="2.5"
                    style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.22));" />
            <text x="${p.x}" y="${p.y + 4}" text-anchor="middle"
                  font-size="11" font-weight="700" fill="#ffffff"
                  font-family="Noto Sans TC, sans-serif">${p.num}</text>

            <text x="${p.x + lp.dx}" y="${p.y + lp.dy}" text-anchor="${lp.anchor}"
                  font-size="11.5" font-weight="${isSelected ? "900" : "700"}"
                  stroke="#fdfbf7" stroke-width="4" stroke-linejoin="round"
                  fill="#fdfbf7" font-family="Noto Sans TC, sans-serif">${shortName}</text>
            <text x="${p.x + lp.dx}" y="${p.y + lp.dy}" text-anchor="${lp.anchor}"
                  font-size="11.5" font-weight="${isSelected ? "900" : "700"}"
                  fill="${isSelected ? fill : "#2a2622"}"
                  font-family="Noto Sans TC, sans-serif">${shortName}</text>
          </g>
        `;
      }).join("");

      return `
        <svg id="${mapIdPrefix}" viewBox="0 0 ${width} ${height}" class="w-full h-auto block rounded-xl bg-[#f4efe6] border border-[#e4ddd1] select-none" role="img" aria-label="${config.title}">
          <defs>
            <marker id="arrow-${mapIdPrefix}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b4332b" opacity="0.7" />
            </marker>
          </defs>
          ${gridLines}
          ${geoFeatures}
          <path d="${routePathD}" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
          <path d="${routePathD}" fill="none" stroke="#b4332b" stroke-width="2.4" stroke-dasharray="6 5"
                stroke-linecap="round" stroke-linejoin="round" marker-mid="url(#arrow-${mapIdPrefix})" />
          ${markersSvg}
        </svg>
      `;
    }

            class="tab-btn shrink-0 px-3.5 py-2 rounded-xl text-left transition flex flex-col items-center justify-center min-w-[68px] sm:min-w-[82px] border ${
              active
                ? "bg-[#b4332b] text-white border-[#b4332b] shadow-sm"
                : "bg-white/90 text-[#2a2622] border-[#e4ddd1] hover:bg-[#f9ebe9]/60"
            }"
          >
            <span class="text-xs sm:text-sm font-bold leading-tight">${item.label}</span>
            <span class="text-[10px] leading-tight mt-0.5 ${active ? "text-white/90" : "text-[#6e675f]"}">${item.sub}</span>
          </button>
        `;
      }).join("");

      tabBar.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          switchTab(btn.dataset.tab);
        });
      });
    }

    function switchTab(tabId, scrollTop = true) {
      currentTab = tabId;
      activePointKey = null;

      renderTabs();
      renderMain();

                <div class="rounded-xl border border-[#e4ddd1] bg-[#f8f5ef] p-3">
                  <div class="flex items-center justify-between gap-2 mb-1">
                    <span class="text-sm font-bold text-[#2a2622]">${d.name}</span>
                    <span class="text-[11px] px-2 py-0.5 rounded bg-white border border-[#e4ddd1] text-[#6e675f]">${d.area}</span>
                  </div>
                  <p class="text-xs text-[#6e675f] leading-relaxed">${d.reason}</p>
                </div>
              `).join("")}
            </div>
          </section>
        </div>
      `;
    }

    function renderDay(day) {
      return `
        <div class="space-y-5">
          <!-- 當日標題卡片 -->
          <section class="journal-card p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-[#b4332b] text-white">${day.tabLabel}</span>
                <span class="text-sm font-bold text-[#2a2622]">${day.dateLabel}</span>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-[#f7f1e3] text-[#a67c2e] font-medium">${day.city}</span>
              </div>
              <a href="${day.routeUrl}" target="_blank" rel="noopener noreferrer"
                 class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-[#1f5f8b] text-white hover:bg-[#184b6e] transition shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                </svg>
                <span>當日 Google 路線導航 ↗</span>
              </a>
            </div>
            <h2 class="font-serif-tc text-xl sm:text-2xl font-bold text-[#2a2622]">${day.title}</h2>
            <p class="text-xs sm:text-sm text-[#6e675f] mt-1">${day.subtitle}</p>
          </section>

          <!-- 互動路線圖與局部放大圖 -->
          <section id="mapSection" class="journal-card p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="w-1.5 h-5 rounded-full bg-[#b4332b]"></span>
                <h3 class="font-serif-tc text-base sm:text-lg font-bold">互動路線圖（點擊時間軸或地圖圓點定位）</h3>
              </div>
              <div class="flex items-center gap-3 text-[11px] text-[#6e675f] bg-[#fdfbf7] px-2.5 py-1 rounded-lg border border-[#e4ddd1]">
                <span class="inline-flex items-center gap-1">
                  <span class="w-2.5 h-2.5 rounded-full bg-[#b4332b] inline-block"></span> 景點／車站
                </span>
                <span class="inline-flex items-center gap-1">
                  <span class="w-2.5 h-2.5 rounded-full bg-[#1f5f8b] inline-block"></span> 住宿飯店
                </span>
                <span class="inline-flex items-center gap-1">
                  <span class="w-4 border-t-2 border-dashed border-[#b4332b] inline-block"></span> 動線順序
                </span>
              </div>
            </div>

            <!-- 選中地點提示條 -->
            <div id="selectedSpotBanner" class="${activePointKey && S[activePointKey] ? "" : "hidden"} mb-3 p-3 rounded-xl bg-[#f9ebe9] border border-[#b4332b]/30 flex flex-wrap items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="text-xs font-bold text-[#b4332b]">目前定位地點</div>
                <div id="selectedSpotTitle" class="text-sm font-bold text-[#2a2622]">
                  ${activePointKey && S[activePointKey] ? S[activePointKey].name : ""}
                </div>
                <div id="selectedSpotNote" class="text-xs text-[#5a534b] mt-0.5">
                  ${activePointKey && S[activePointKey] ? S[activePointKey].note : ""}
                </div>
              </div>
              <a id="selectedSpotLink" href="${activePointKey && S[activePointKey] ? S[activePointKey].gmap : "#"}"
                 target="_blank" rel="noopener noreferrer"
                 class="shrink-0 px-3 py-1.5 rounded-lg bg-white border border-[#b4332b]/30 text-xs font-bold text-[#b4332b] hover:bg-[#b4332b] hover:text-white transition">
                開啟地圖 ↗
              </a>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div>
                <div class="text-xs font-bold text-[#6e675f] mb-1.5 flex items-center justify-between">
                  <span>① ${day.overviewMap.title}</span>
                </div>
                <div id="overviewMapWrap">
                  ${buildVectorMapSVG(day.overviewMap, day.stops, activePointKey, "svg-overview")}
                </div>
              </div>

              <div>
                <div class="text-xs font-bold text-[#6e675f] mb-1.5 flex items-center justify-between">
                  <span>② ${day.detailMap.title}</span>
                </div>
                <div id="detailMapWrap">
                  ${buildVectorMapSVG(day.detailMap, day.stops, activePointKey, "svg-detail")}
                </div>
              </div>
            </div>
          </section>

          <!-- 當日時間軸 -->
          <section class="journal-card p-4 sm:p-5">
            <div class="flex items-center gap-2 mb-4">
              <span class="w-1.5 h-5 rounded-full bg-[#b4332b]"></span>
              <h3 class="font-serif-tc text-base sm:text-lg font-bold">詳細時間軸</h3>
            </div>

            <div class="space-y-3">
              ${day.timeline.map(item => {
                const pt = item.point ? S[item.point] : null;
                const stopNum = item.point ? day.stops.indexOf(item.point) + 1 : 0;
                const isSelected = activePointKey && activePointKey === item.point;
                const isHotel = pt && pt.isHotel;

                return `
                  <div
                    class="timeline-row rounded-xl border p-3.5 ${
                      pt ? "is-clickable cursor-pointer" : ""
                    } ${isSelected ? "is-selected" : "border-[#e4ddd1] bg-[#fdfbf7]"}"
                    ${pt ? `data-focus-point="${item.point}"` : ""}
                  >
                    <div class="flex items-start gap-3">
                      <div class="flex flex-col items-center shrink-0 w-14">
                        <span class="text-xs sm:text-sm font-black text-[#2a2622] tracking-tight">${item.time}</span>
                        ${stopNum > 0 ? `
                          <span class="mt-1.5 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm ${
                            isHotel ? "bg-[#1f5f8b]" : "bg-[#b4332b]"
                          }">
                            ${stopNum}
                          </span>
                        ` : `
                          <span class="mt-1.5 w-2.5 h-2.5 rounded-full bg-[#c8bfb0]"></span>
                        `}
                      </div>

                      <div class="flex-1 min-w-0">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                          <h4 class="text-sm sm:text-base font-bold text-[#2a2622]">${item.title}</h4>
                          ${pt ? `
                            <div class="flex items-center gap-1.5">
                              <button type="button"
                                class="locate-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-white border border-[#e4ddd1] text-[#b4332b] hover:bg-[#f9ebe9] transition"
                                data-focus-point="${item.point}">
                                地圖定位
                              </button>
                              <a href="${pt.gmap}" target="_blank" rel="noopener noreferrer"
                                 onclick="event.stopPropagation()"
                                 class="px-2 py-1 rounded-lg text-[11px] font-bold bg-white border border-[#e4ddd1] text-[#1f5f8b] hover:bg-[#e9f2f8] transition">
                                Google 地圖 ↗
                              </a>
                            </div>
                          ` : ""}
                        </div>

                        <p class="text-xs sm:text-sm text-[#4a443e] mt-1 leading-relaxed">${item.desc}</p>

                        ${pt && pt.note ? `
                          <div class="mt-2 text-xs text-[#6e675f] bg-white/90 rounded-lg px-2.5 py-1.5 border border-[#ece6db]">
                            <span class="font-bold text-[#a67c2e]">筆記：</span>${pt.note}
                          </div>
                        ` : ""}

                        ${item.transit ? `
                          <div class="mt-2.5 pt-2 border-t border-dashed border-[#dfd7c8] flex items-center gap-1.5 text-xs font-medium text-[#1f5f8b]">
                            <span>移動方式：</span>
                            <span>${item.transit}</span>
                          </div>
                        ` : ""}
                      </div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </section>

          <!-- 當日注意事項 & 待辦 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <section class="journal-card p-4 sm:p-5 bg-[#f9ebe9]/35 border-[#e8cbc8]">
              <div class="flex items-center gap-2 mb-3">
                <span class="w-1.5 h-5 rounded-full bg-[#b4332b]"></span>
                <h3 class="font-serif-tc text-base font-bold text-[#b4332b]">當日注意事項與提醒</h3>
              </div>
              <ul class="space-y-2 text-xs sm:text-sm text-[#3b3530]">
                ${day.warns.map(w => `
                  <li class="flex items-start gap-2">
                    <span class="text-[#b4332b] font-bold mt-0.5">•</span>
                    <span class="leading-relaxed">${w}</span>
                  </li>
                `).join("")}
              </ul>
            </section>

            <section class="journal-card p-4 sm:p-5">
              <div class="flex items-center gap-2 mb-3">
                <span class="w-1.5 h-5 rounded-full bg-[#a67c2e]"></span>
                <h3 class="font-serif-tc text-base font-bold">本日前置待辦清單</h3>
              </div>
              <div class="space-y-2">
                ${day.todos.map(t => {
                  const checked = Boolean(todoState[t.id]);
                  return `
                    <label class="flex items-start gap-2.5 p-2.5 rounded-xl border border-[#ece6db] bg-[#fdfbf7] hover:bg-white cursor-pointer transition">
                      <input type="checkbox" class="custom-check mt-0.5 todo-checkbox" data-todo-id="${t.id}" ${checked ? "checked" : ""} />
                      <span class="text-xs sm:text-sm ${checked ? "line-through text-[#9a9288]" : "text-[#2a2622] font-medium"}">${t.text}</span>
                    </label>
                  `;
                }).join("")}
              </div>
            </section>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 5. 事件綁定（地圖雙向定位、待辦勾選儲存、分享按鈕）
     * ============================================================================
     */
    function focusPointOnMap(pointKey, shouldScrollToMap = true) {
      if (!pointKey || !S[pointKey]) return;
      activePointKey = pointKey;

      const day = DAYS.find(d => d.id === currentTab);
      if (!day) return;

      renderMain();

      if (shouldScrollToMap) {
        const mapSec = document.getElementById("mapSection");
        if (mapSec) {
          mapSec.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }
    }

    function renderMain() {
      const main = document.getElementById("appMain");
      if (currentTab === "overview") {
        main.innerHTML = renderOverview();

        main.querySelectorAll(".jump-day-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            switchTab(btn.dataset.jumpDay);
          });
        });
      } else {
        const day = DAYS.find(d => d.id === currentTab) || DAYS[0];
        main.innerHTML = renderDay(day);

        main.querySelectorAll("[data-focus-point]").forEach(el => {
          el.addEventListener("click", e => {
            e.stopPropagation();
            focusPointOnMap(el.dataset.focusPoint, true);
          });
        });

        main.querySelectorAll(".map-node").forEach(node => {
          node.addEventListener("click", e => {
            e.stopPropagation();
            focusPointOnMap(node.dataset.point, false);
          });
        });
      }

      main.querySelectorAll(".todo-checkbox").forEach(cb => {
        cb.addEventListener("change", () => {
          const id = cb.dataset.todoId;
          todoState[id] = cb.checked;
          saveTodoState();
          renderMain();
          showToast(cb.checked ? "已勾選完成項目" : "已取消勾選");
        });
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");
      toastText.textContent = msg;
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2200);
    }

    function setupShareButton() {
      const shareBtn = document.getElementById("shareBtn");
      shareBtn.addEventListener("click", async () => {
        const shareUrl = window.location.href;
        const shareTitle = "京都＋名古屋 6 日行程（12/31–1/5）";
        const shareText = "這是我們的京都＋名古屋 6 日跨年行程表與互動路線圖，點擊即可查看每日動線與導航！";

        if (navigator.share) {
          try {
            await navigator.share({
              title: shareTitle,
              text: shareText,
              url: shareUrl
            });
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        try {
          const tempInput = document.createElement("textarea");
          tempInput.value = shareUrl;
          tempInput.setAttribute("readonly", "");
          tempInput.style.position = "fixed";
          tempInput.style.opacity = "0";
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand("copy");
          document.body.removeChild(tempInput);
          showToast("已複製行程分享連結！");
        } catch (e) {
          showToast("請複製瀏覽器網址列分享給旅伴");
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      initPasscodeGate();
      initTabFromHash();
      renderTabs();
      renderMain();
      setupShareButton();
    });
  </script>
</body>
</html>
